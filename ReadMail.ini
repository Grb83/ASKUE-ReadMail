; Служба для запуска и проверки приложения приема электронной почты
; Если файл ReadMail.exe запустить с параметром /install 
;   ReadMail.exe /install
;   - то программа запустится в режиме установки/регистрации службы
; Если файл ReadMail.exe запустить с параметром /uninstall 
; ReadMail.exe /uninstall
;   - то программа запустится в режиме удаления/разрегистрации службы

; Описание параметров

; [PARAM]

; timerun=    Интервал запуска приложения проверки почты (В Минутах)
; timewait=   Интервал ожидания завершения работы приложения проверки 
;             почты (В Минутах)
; timedelay=  Интервал сна службы через который происходит проверка 
;             внешних запросов (В милисекундах)
; cline=      Относительный путь к приложению приема почты с параметром 
;             командной строки, если необходимо

[PARAM]
timerun=5
timewait=5
timedelay=200
cline=rm\RM.exe /oc
